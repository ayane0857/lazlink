name: lazlink
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazlink_app

    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase

    depends_on:
      db:
        condition: service_healthy

    networks:
      - lazlink_network

  db:
    image: postgres:18.6
    container_name: lazlink_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - lazlink_network

  db_admin:
    image: adminer:6.0.1
    container_name: lazlink_db_admin
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - lazlink_network

volumes:
  db_data:

networks:
  lazlink_network:
    driver: bridge
